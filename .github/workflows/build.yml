name: Build Check

on:
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        global-json-file: 'Directory.Build.props'
        source-priority: 'critical' # Make NuGet.org primary

    - name: Restore NuGet packages
      run: dotnet restore "AVR Simulator.sln"

    - name: Build Solution
      run: dotnet build -c Release "AVR Simulator.sln"

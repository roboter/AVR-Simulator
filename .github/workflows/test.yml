name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore "AVR Simulator.sln"

      - name: Build Solution
        run: dotnet build -c Release "AVR Simulator.sln" --no-restore

      - name: Run Tests
        run: dotnet test "AVR Simulator.sln" -c Release --no-build --verbosity normal

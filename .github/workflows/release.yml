name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.2)'
        required: false
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  test:
    name: Run Test Check
    uses: ./.github/workflows/test.yml

  release:
    name: Build & Publish Release
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore "AVR Simulator.sln"

      - name: Publish Single-File Release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release

          dotnet publish "AVR-Simulator.UI\AVR-Simulator.UI.csproj" `
            -c Release `
            -r win-x86 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o release

          Copy-Item "LICENSE" "release\"

          Compress-Archive `
            -Path "release\*" `
            -DestinationPath "AVR_Simulator.zip" `
            -Force

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: AVR-Simulator-${{ inputs.tag_name || github.ref_name }}
          path: |
            AVR_Simulator.zip
            release/

      - name: Save Artifacts to Release Page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: AVR Simulator ${{ inputs.tag_name || github.ref_name }}
          files: |
            AVR_Simulator.zip
            release/AVR Simulator.exe
            release/Blink.hex
            release/Blink.c
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}